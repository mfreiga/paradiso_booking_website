# Netlify build configuration. The Next.js runtime plugin is added automatically.

[build]
  # Deploy previews (pull requests) and branch deploys: build only. They share
  # the production database, so they must never change it — otherwise opening
  # a pull request would migrate the live database before anyone reviewed it.
  command = "npm run build"

[context.production]
  # Production (pushes to main): apply pending database migrations first, then
  # build. If a migration fails the build stops and Netlify keeps the previous
  # version online — so code and database can never get out of step.
  command = "npx prisma migrate deploy && npm run build"

[build.environment]
  NODE_VERSION = "20"
